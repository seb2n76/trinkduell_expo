version: '3.8'

# Secrets are read from a local .env file (see server/.env.example) and must
# NEVER be committed to git. Copy server/.env.example to server/.env and fill
# in real values before running `docker compose up`.

services:
  db:
    image: postgres:15-alpine
    container_name: trinkduell-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trinkduell_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in server/.env gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-trinkduell}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"

  backend:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: trinkduell-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-trinkduell_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trinkduell}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss in server/.env gesetzt sein}
    depends_on:
      - db

volumes:
  pgdata:
    driver: local
