# Kein `version:` — seit Compose v2 obsolet und nur eine Warnung bei jedem
# Befehl.
#
# Secrets are read from a local .env file (see server/.env.example) and must
# NEVER be committed to git. Copy server/.env.example to server/.env and fill
# in real values before running `docker compose up`.

services:
  db:
    image: postgres:15-alpine
    container_name: trinkduell-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trinkduell_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss in server/.env gesetzt sein}
      POSTGRES_DB: ${POSTGRES_DB:-trinkduell}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"

  backend:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: trinkduell-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-trinkduell_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-trinkduell}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss in server/.env gesetzt sein}
      # Optional — see docs/EMAIL_SETUP.md. Unset means the beta fallback
      # (reset code shown in-app) stays active.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      # Optional: Bild-Uploads nach Cloudflare R2. Ohne diese Werte läuft die
      # App weiter, nur ohne Uploads.
      #
      # ACHTUNG: Ein Wert in server/.env reicht NICHT. Compose liest die Datei
      # zwar, gibt aber nur an den Container weiter, was hier explizit
      # aufgelistet ist. Jede neue Umgebungsvariable braucht deshalb zwei
      # Einträge: einen hier und einen in server/.env.example (Dokumentation).
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
